<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck.ai</title>
  <style>
    :root {
      --bg: #ffffff;
      --sidebar: #f6f6f7;
      --text: #1a1a1c;
      --muted: #6b6b72;
      --border: #e2e2e6;
      --accent: #de5833;
      --bar: #ffffff;
      --hover: #ececef;
      --user-bubble: #f0f0f3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1f;
        --sidebar: #151517;
        --text: #ececf1;
        --muted: #9a9aa3;
        --border: #33333a;
        --accent: #f07a50;
        --bar: #2a2a2f;
        --hover: #2a2a2f;
        --user-bubble: #2a2a2f;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
    }
    button { font-family: inherit; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 264px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 4px;
      transition: width 0.2s ease, padding 0.2s ease;
    }
    .sidebar.collapsed { width: 0; padding: 0; border: none; overflow: hidden; }
    .side-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      width: 100%;
      white-space: nowrap;
    }
    .side-row:hover { background: var(--hover); }
    .side-row svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .side-label {
      font-size: 12px;
      color: var(--muted);
      padding: 14px 10px 6px;
      font-weight: 600;
    }
    .history-item {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- Main area ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .topbar .left, .topbar .right { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .wordmark { font-weight: 700; font-size: 17px; }
    .model-pill {
      background: var(--bar);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .model-pill select {
      background: transparent;
      border: none;
      color: var(--text);
      font: inherit;
      outline: none;
      cursor: pointer;
    }

    /* ---------- Start screen ---------- */
    .stage {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .start {
      margin: auto;
      width: 100%;
      max-width: 680px;
      padding: 0 20px;
      text-align: center;
      transition: opacity 0.2s;
    }
    .start h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .start .sub {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 32px;
    }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }
    .chip {
      background: var(--bar);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }

    /* ---------- Curved chat bar ---------- */
    .composer-wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .composer {
      background: var(--bar);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 10px 10px 10px 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      display: flex;
      align-items: flex-end;
      gap: 8px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 6px 24px rgba(222,88,51,0.15);
    }
    .composer textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      line-height: 1.4;
      padding: 9px 0;
      max-height: 180px;
    }
    .composer textarea::placeholder { color: var(--muted); }
    .composer .tools { display: flex; align-items: center; gap: 4px; }
    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.35; cursor: default; }
    .send-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.2; }
    .disclaimer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 10px 0 16px;
    }

    /* ---------- Messages ---------- */
    .messages {
      display: none;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .messages.active { display: flex; }
    .msg {
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bubble);
      padding: 10px 16px;
      border-radius: 20px;
      max-width: 80%;
    }
    .msg.bot { align-self: flex-start; max-width: 100%; }
    .bottom-dock {
      display: none;
      flex-direction: column;
    }
    .bottom-dock.active { display: flex; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <button class="side-row" id="newChat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <button class="side-row">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      Search chats
    </button>
    <div class="side-label">Recent</div>
    <button class="side-row history-item">Trip ideas for Portugal</button>
    <button class="side-row history-item">Python list comprehension help</button>
    <button class="side-row history-item">Healthy weeknight dinners</button>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="left">
        <button class="icon-btn" id="toggleSidebar" title="Toggle sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <span class="wordmark">Duck.ai</span>
      </div>
      <div class="right">
        <label class="model-pill">
          <select id="model">
            <option>Claude Haiku 4.5</option>
            <option>GPT-4o mini</option>
            <option>Llama 3.3 70B</option>
            <option>Mistral Small 3</option>
          </select>
        </label>
      </div>
    </div>

    <div class="stage" id="stage">
      <!-- Start screen -->
      <section class="start" id="start">
        <h1>How can I help you today?</h1>
        <p class="sub">Chat privately. Your conversations are anonymous.</p>
        <div class="composer-wrap">
          <div class="composer">
            <textarea id="inputStart" rows="1" placeholder="Ask anything"></textarea>
            <div class="tools">
              <button class="send-btn" id="sendStart" title="Send">
                <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="suggestions">
          <button class="chip" data-prompt="Explain quantum entanglement simply.">Explain a concept</button>
          <button class="chip" data-prompt="Give me a 3-day itinerary for Lisbon.">Plan a trip</button>
          <button class="chip" data-prompt="Write a Python function that removes duplicates from a list while keeping order.">Write code</button>
          <button class="chip" data-prompt="Suggest five healthy dinners that take under 30 minutes.">Get ideas</button>
        </div>
      </section>

      <!-- Conversation -->
      <section class="messages" id="messages"></section>
    </div>

    <!-- Bottom docked bar, shown once a chat has started -->
    <div class="bottom-dock" id="bottomDock">
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="inputChat" rows="1" placeholder="Ask a follow-up"></textarea>
          <div class="tools">
            <button class="send-btn" id="sendChat" title="Send">
              <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
        <p class="disclaimer">AI can make mistakes. Check important information.</p>
      </div>
    </div>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const start = document.getElementById('start');
    const messages = document.getElementById('messages');
    const bottomDock = document.getElementById('bottomDock');
    const stage = document.getElementById('stage');
    const modelSelect = document.getElementById('model');

    document.getElementById('toggleSidebar').addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    document.getElementById('newChat').addEventListener('click', () => {
      messages.innerHTML = '';
      messages.classList.remove('active');
      bottomDock.classList.remove('active');
      start.classList.remove('hidden');
      document.getElementById('inputStart').value = '';
      document.getElementById('inputChat').value = '';
    });

    function addMessage(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      messages.appendChild(div);
      stage.scrollTop = stage.scrollHeight;
      return div;
    }

    function respond(text, bubble) {
      // Placeholder. Replace this with a call to your AI backend.
      setTimeout(() => {
        bubble.textContent = `[${modelSelect.value}] Placeholder reply to: "${text}". Connect a backend to get real answers.`;
        stage.scrollTop = stage.scrollHeight;
      }, 600);
    }

    function sendFirst(text) {
      text = text.trim();
      if (!text) return;
      start.classList.add('hidden');
      messages.classList.add('active');
      bottomDock.classList.add('active');
      addMessage(text, 'user');
      respond(text, addMessage('Thinking...', 'bot'));
    }

    function sendFollow(text) {
      text = text.trim();
      if (!text) return;
      document.getElementById('inputChat').value = '';
      addMessage(text, 'user');
      respond(text, addMessage('Thinking...', 'bot'));
    }

    document.getElementById('sendStart').addEventListener('click', () => {
      const input = document.getElementById('inputStart');
      sendFirst(input.value);
      input.value = '';
    });

    document.getElementById('sendChat').addEventListener('click', () => {
      sendFollow(document.getElementById('inputChat').value);
    });

    ['inputStart', 'inputChat'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          document.getElementById(id === 'inputStart' ? 'sendStart' : 'sendChat').click();
        }
      });
      el.addEventListener('input', () => {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 180) + 'px';
      });
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => sendFirst(chip.dataset.prompt));
    });
  </script>
</body>
</html>
