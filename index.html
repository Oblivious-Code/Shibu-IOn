<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoShibu.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: "Duck Sans", "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg: #ffffff;
      --sidebar: #f6f6f7;
      --text: #1a1a1c;
      --muted: #6b6b72;
      --border: #e2e2e6;
      --accent: #de5833;
      --bar: #ffffff;
      --hover: #ececef;
      --user-bubble: #f0f0f3;
      --danger: #d64541;
      --overlay: rgba(0,0,0,0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1f;
        --sidebar: #151517;
        --text: #ececf1;
        --muted: #9a9aa3;
        --border: #33333a;
        --accent: #f07a50;
        --bar: #2a2a2f;
        --hover: #2a2a2f;
        --user-bubble: #2a2a2f;
        --danger: #ff6b68;
        --overlay: rgba(0,0,0,0.6);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      font-weight: 500;
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font-family: inherit; }

    /* Sidebar */
    .sidebar {
      width: 264px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 4px;
      transition: width 0.2s ease, padding 0.2s ease;
    }
    .sidebar.collapsed { width: 0; padding: 0; border: none; overflow: hidden; }
    .side-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      width: 100%;
      min-width: 0;
    }
    .side-row:hover { background: var(--hover); }
    .side-row.current { background: var(--hover); }
    .side-row svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .side-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .side-label { font-size: 12px; color: var(--muted); padding: 14px 10px 6px; font-weight: 600; }
    .empty-note { font-size: 13px; color: var(--muted); padding: 6px 10px; }
    #recentList { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .topbar .left, .topbar .right { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .icon-btn.delete:hover { color: var(--danger); }
    .wordmark { font-weight: 700; font-size: 17px; }

    /* Stage */
    .stage { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .start {
      margin: auto;
      width: 100%;
      max-width: 680px;
      padding: 0 20px;
      text-align: center;
    }
    .start h1 { font-size: 32px; font-weight: 600; margin-bottom: 10px; }
    .start .sub { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }
    .chip {
      background: var(--bar);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }

    /* Curved chat bar */
    .composer-wrap { width: 100%; max-width: 680px; margin: 0 auto; padding: 0 20px; }
    .composer {
      position: relative;
      background: var(--bar);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 12px 12px 10px 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 6px 24px rgba(222,88,51,0.15);
    }
    .composer textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      line-height: 1.4;
      padding: 6px 0;
      max-height: 180px;
    }
    .composer textarea::placeholder { color: var(--muted); }
    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .pill-btn {
      background: var(--sidebar);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill-btn:hover { border-color: var(--accent); }
    .pill-btn.active { border-color: var(--accent); color: var(--accent); }
    .pill-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .pill-btn .caret { font-size: 10px; color: var(--muted); }

    /* Mode picker */
    .mode-wrap { position: relative; }
    .mode-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      min-width: 240px;
      background: var(--bar);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 6px;
      z-index: 10;
    }
    .mode-menu.open { display: block; }
    .mode-option {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .mode-option:hover { background: var(--hover); }
    .mode-option strong { font-size: 14px; font-weight: 600; }
    .mode-option span { font-size: 12px; font-weight: 500; color: var(--muted); }
    .mode-option.selected strong::after { content: "  ✓"; color: var(--accent); }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.35; cursor: default; }
    .send-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.2; }
    .disclaimer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 10px 0 16px;
    }

    /* Customise modal */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--bar);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 460px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .modal h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .modal .hint { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 13px; font-weight: 600; }
    .field select, .field textarea {
      background: var(--sidebar);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 500;
      outline: none;
    }
    .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .btn {
      border: 1px solid var(--border);
      background: none;
      color: var(--text);
      padding: 9px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Messages */
    .messages {
      display: none;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .messages.active { display: flex; }
    .msg { line-height: 1.6; font-size: 15px; white-space: pre-wrap; }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bubble);
      padding: 10px 16px;
      border-radius: 20px;
      max-width: 80%;
    }
    .msg.bot { align-self: flex-start; max-width: 100%; }
    .bottom-dock { display: none; flex-direction: column; }
    .bottom-dock.active { display: flex; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <button class="side-row" id="newChat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span class="side-text">New chat</span>
    </button>
    <button class="side-row">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span class="side-text">Search chats</span>
    </button>
    <div class="side-label">Recent</div>
    <div id="recentList"></div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="left">
        <button class="icon-btn" id="toggleSidebar" title="Toggle sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <span class="wordmark">Shibu.ai</span>
      </div>
      <div class="right">
        <button class="icon-btn delete" id="deleteChat" title="Delete this chat">
          <svg viewBox="0 0 24 24"><path d="M12 22c4-2.5 6-5.5 6-9 0-2.2-1-4-2.2-5.4-.3 1.6-1.2 2.7-2.3 3.2C13.6 7.4 12.8 4.6 11 2c.3 2.6-1 4.6-2.6 6.4C7.2 10 6 11.8 6 14.5 6 18.6 8.7 22 12 22z"/><path d="M12 22c-1.5 0-2.5-1.2-2.5-2.7 0-1.6 1.2-2.6 2.5-4 1.3 1.4 2.5 2.4 2.5 4 0 1.5-1 2.7-2.5 2.7z"/></svg>
        </button>
      </div>
    </div>

    <div class="stage" id="stage">
      <!-- Start screen -->
      <section class="start" id="start">
        <h1>How can I help you today?</h1>
        <p class="sub">Chat privately. Your conversations are anonymous.</p>
        <div class="composer-wrap">
          <div class="composer">
            <textarea id="inputStart" rows="1" placeholder="Ask anything"></textarea>
            <div class="composer-bottom">
              <div class="tools">
                <button class="pill-btn" type="button" data-action="customise">
                  <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
                  Customise
                </button>
                <button class="pill-btn" type="button" data-action="image">
                  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
                  Create image
                </button>
                <div class="mode-wrap">
                  <button class="pill-btn" type="button" data-role="mode-toggle">
                    <span data-role="mode-label">Reasonable</span><span class="caret">▼</span>
                  </button>
                  <div class="mode-menu" data-role="mode-menu">
                    <button class="mode-option" type="button" data-mode="Fast">
                      <strong>Fast</strong><span>Quick answers for simple questions</span>
                    </button>
                    <button class="mode-option selected" type="button" data-mode="Reasonable">
                      <strong>Reasonable</strong><span>Balanced depth and speed</span>
                    </button>
                  </div>
                </div>
              </div>
              <button class="send-btn" id="sendStart" title="Send">
                <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="suggestions">
          <button class="chip" data-prompt="Explain quantum entanglement simply.">Explain a concept</button>
          <button class="chip" data-prompt="Give me a 3-day itinerary for Lisbon.">Plan a trip</button>
          <button class="chip" data-prompt="Write a Python function that removes duplicates from a list while keeping order.">Write code</button>
          <button class="chip" data-prompt="Suggest five healthy dinners that take under 30 minutes.">Get ideas</button>
        </div>
      </section>

      <!-- Conversation -->
      <section class="messages" id="messages"></section>
    </div>

    <!-- Bottom bar, shown once a chat has started -->
    <div class="bottom-dock" id="bottomDock">
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="inputChat" rows="1" placeholder="Ask a follow-up"></textarea>
          <div class="composer-bottom">
            <div class="tools">
              <button class="pill-btn" type="button" data-action="customise">
                <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
                Customise
              </button>
              <button class="pill-btn" type="button" data-action="image">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
                Create image
              </button>
              <div class="mode-wrap">
                <button class="pill-btn" type="button" data-role="mode-toggle">
                  <span data-role="mode-label">Reasonable</span><span class="caret">▼</span>
                </button>
                <div class="mode-menu" data-role="mode-menu">
                  <button class="mode-option" type="button" data-mode="Fast">
                    <strong>Fast</strong><span>Quick answers for simple questions</span>
                  </button>
                  <button class="mode-option selected" type="button" data-mode="Reasonable">
                    <strong>Reasonable</strong><span>Balanced depth and speed</span>
                  </button>
                </div>
              </div>
            </div>
            <button class="send-btn" id="sendChat" title="Send">
              <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
        <p class="disclaimer">AI can make mistakes. Check important information.</p>
      </div>
    </div>
  </div>

  <!-- Customise responses modal -->
  <div class="overlay" id="customiseOverlay">
    <div class="modal" role="dialog" aria-labelledby="customiseTitle">
      <h2 id="customiseTitle">Customise responses</h2>
      <p class="hint">These settings apply to every reply in this browser.</p>
      <div class="field">
        <label for="tone">Tone</label>
        <select id="tone">
          <option value="Balanced">Balanced</option>
          <option value="Friendly">Friendly</option>
          <option value="Formal">Formal</option>
          <option value="Concise">Concise</option>
          <option value="Playful">Playful</option>
        </select>
      </div>
      <div class="field">
        <label for="length">Length</label>
        <select id="length">
          <option value="Short">Short</option>
          <option value="Medium" selected>Medium</option>
          <option value="Detailed">Detailed</option>
        </select>
      </div>
      <div class="field">
        <label for="instructions">Custom instructions</label>
        <textarea id="instructions" placeholder="For example: Use metric units and explain jargon briefly."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" type="button" id="cancelCustomise">Cancel</button>
        <button class="btn primary" type="button" id="saveCustomise">Save</button>
      </div>
    </div>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const start = document.getElementById('start');
    const messages = document.getElementById('messages');
    const bottomDock = document.getElementById('bottomDock');
    const stage = document.getElementById('stage');
    const recentList = document.getElementById('recentList');

    let currentMode = 'Reasonable';
    let imageMode = false;
    let settings = { tone: 'Balanced', length: 'Medium', instructions: '' };

    try {
      const saved = JSON.parse(localStorage.getItem('duckai-settings') || 'null');
      if (saved) settings = { ...settings, ...saved };
    } catch (e) {}

    // ---------- Chat storage ----------
    const CHATS_KEY = 'duckai-chats';
    let chats = [];
    let currentChatId = null;

    try {
      chats = JSON.parse(localStorage.getItem(CHATS_KEY) || '[]');
      if (!Array.isArray(chats)) chats = [];
    } catch (e) { chats = []; }

    function saveChats() {
      try { localStorage.setItem(CHATS_KEY, JSON.stringify(chats)); } catch (e) {}
    }

    function getCurrentChat() {
      return chats.find(c => c.id === currentChatId) || null;
    }

    function renderRecent() {
      recentList.innerHTML = '';
      const sorted = [...chats].sort((a, b) => b.updatedAt - a.updatedAt);
      if (sorted.length === 0) {
        const note = document.createElement('p');
        note.className = 'empty-note';
        note.textContent = 'No chats yet';
        recentList.appendChild(note);
        return;
      }
      sorted.forEach(chat => {
        const btn = document.createElement('button');
        btn.className = 'side-row' + (chat.id === currentChatId ? ' current' : '');
        btn.title = chat.title;
        const label = document.createElement('span');
        label.className = 'side-text';
        label.textContent = chat.title;
        btn.appendChild(label);
        btn.addEventListener('click', () => loadChat(chat.id));
        recentList.appendChild(btn);
      });
    }

    // ---------- View helpers ----------
    function showChatView() {
      start.classList.add('hidden');
      messages.classList.add('active');
      bottomDock.classList.add('active');
    }

    function showStartView() {
      messages.innerHTML = '';
      messages.classList.remove('active');
      bottomDock.classList.remove('active');
      start.classList.remove('hidden');
      document.getElementById('inputStart').value = '';
      document.getElementById('inputChat').value = '';
    }

    function renderMessage(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      messages.appendChild(div);
      stage.scrollTop = stage.scrollHeight;
      return div;
    }

    function loadChat(id) {
      const chat = chats.find(c => c.id === id);
      if (!chat) return;
      currentChatId = id;
      messages.innerHTML = '';
      chat.messages.forEach(m => renderMessage(m.text, m.who));
      showChatView();
      renderRecent();
      stage.scrollTop = stage.scrollHeight;
    }

    function startNewChat() {
      currentChatId = null;
      showStartView();
      renderRecent();
    }

    // ---------- Sidebar and toolbar ----------
    document.getElementById('toggleSidebar').addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    document.getElementById('newChat').addEventListener('click', startNewChat);

    document.getElementById('deleteChat').addEventListener('click', () => {
      const chat = getCurrentChat();
      if (!chat) return;
      if (!confirm('Delete this chat?')) return;
      chats = chats.filter(c => c.id !== chat.id);
      saveChats();
      startNewChat();
    });

    // ---------- Mode picker (both bars share the same mode) ----------
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('[data-role="mode-label"]').forEach(l => l.textContent = mode);
      document.querySelectorAll('.mode-option').forEach(o => {
        o.classList.toggle('selected', o.dataset.mode === mode);
      });
    }

    document.querySelectorAll('[data-role="mode-toggle"]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const menu = btn.parentElement.querySelector('[data-role="mode-menu"]');
        document.querySelectorAll('[data-role="mode-menu"]').forEach(m => {
          if (m !== menu) m.classList.remove('open');
        });
        menu.classList.toggle('open');
      });
    });

    document.querySelectorAll('.mode-option').forEach(opt => {
      opt.addEventListener('click', e => {
        e.stopPropagation();
        setMode(opt.dataset.mode);
        document.querySelectorAll('[data-role="mode-menu"]').forEach(m => m.classList.remove('open'));
      });
    });

    document.addEventListener('click', () => {
      document.querySelectorAll('[data-role="mode-menu"]').forEach(m => m.classList.remove('open'));
    });

    // ---------- Create image toggle ----------
    function setImageMode(on) {
      imageMode = on;
      document.querySelectorAll('[data-action="image"]').forEach(b => b.classList.toggle('active', on));
      document.getElementById('inputStart').placeholder = on ? 'Describe the image you want' : 'Ask anything';
      document.getElementById('inputChat').placeholder = on ? 'Describe the image you want' : 'Ask a follow-up';
    }

    document.querySelectorAll('[data-action="image"]').forEach(btn => {
      btn.addEventListener('click', () => setImageMode(!imageMode));
    });

    // ---------- Customise modal ----------
    const overlay = document.getElementById('customiseOverlay');
    const toneEl = document.getElementById('tone');
    const lengthEl = document.getElementById('length');
    const instructionsEl = document.getElementById('instructions');

    function openCustomise() {
      toneEl.value = settings.tone;
      lengthEl.value = settings.length;
      instructionsEl.value = settings.instructions;
      overlay.classList.add('open');
    }

    document.querySelectorAll('[data-action="customise"]').forEach(btn => {
      btn.addEventListener('click', openCustomise);
    });

    document.getElementById('cancelCustomise').addEventListener('click', () => overlay.classList.remove('open'));
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

    document.getElementById('saveCustomise').addEventListener('click', () => {
      settings = {
        tone: toneEl.value,
        length: lengthEl.value,
        instructions: instructionsEl.value.trim()
      };
      try { localStorage.setItem('duckai-settings', JSON.stringify(settings)); } catch (e) {}
      overlay.classList.remove('open');
    });

    // ---------- Sending messages ----------
    function respond(text, chatId, index, bubble) {
      // Placeholder. Replace with a call to your AI backend.
      // Send currentMode, settings (tone, length, instructions) and imageMode with the request.
      setTimeout(() => {
        let reply;
        if (imageMode) {
          reply = `[Image request] Placeholder for an image generated from: "${text}". Connect an image model to show the result.`;
        } else {
          reply = `[${currentMode} mode | ${settings.tone}, ${settings.length}] Placeholder reply to: "${text}". Connect a backend to get real answers.`;
        }
        bubble.textContent = reply;

        const chat = chats.find(c => c.id === chatId);
        if (chat && chat.messages[index]) {
          chat.messages[index].text = reply;
          saveChats();
        }
        stage.scrollTop = stage.scrollHeight;
      }, 600);
    }

    function sendMessage(text, inputEl) {
      const chat = getCurrentChat();
      if (!chat) return;

      chat.messages.push({ who: 'user', text });
      renderMessage(text, 'user');

      chat.messages.push({ who: 'bot', text: 'Thinking...' });
      const index = chat.messages.length - 1;
      const bubble = renderMessage('Thinking...', 'bot');

      chat.updatedAt = Date.now();
      saveChats();
      renderRecent();

      inputEl.value = '';
      respond(text, chat.id, index, bubble);
    }

    function sendFirst(text) {
      text = text.trim();
      if (!text) return;
      const chat = {
        id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: text.length > 40 ? text.slice(0, 40) + '…' : text,
        createdAt: Date.now(),
        updatedAt: Date.now(),
        messages: []
      };
      chats.push(chat);
      currentChatId = chat.id;
      showChatView();
      sendMessage(text, document.getElementById('inputStart'));
    }

    function sendFollow(text) {
      text = text.trim();
      if (!text) return;
      if (!getCurrentChat()) {
        sendFirst(text);
        return;
      }
      sendMessage(text, document.getElementById('inputChat'));
    }

    document.getElementById('sendStart').addEventListener('click', () => {
      sendFirst(document.getElementById('inputStart').value);
    });

    document.getElementById('sendChat').addEventListener('click', () => {
      sendFollow(document.getElementById('inputChat').value);
    });

    ['inputStart', 'inputChat'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          document.getElementById(id === 'inputStart' ? 'sendStart' : 'sendChat').click();
        }
      });
      el.addEventListener('input', () => {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 180) + 'px';
      });
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => sendFirst(chip.dataset.prompt));
    });

    // ---------- Initial render ----------
    renderRecent();
  <script src="app.js"></script>
</body>
</html>
