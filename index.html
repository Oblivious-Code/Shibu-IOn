<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private AI Chat — UI Mockup</title>
  <style>
    :root {
      --bg-app: #18181b;
      --bg-sidebar: #111114;
      --bg-surface: #222227;
      --bg-hover: #2c2c33;
      --text-primary: #f4f4f6;
      --text-secondary: #a1a1aa;
      --accent: #de5833;
      --accent-hover: #c64927;
      --border: #2e2e36;
      --badge-bg: rgba(34, 197, 94, 0.12);
      --badge-text: #4ade80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1rem;
      padding: 4px 6px;
    }

    .privacy-pill {
      font-size: 0.72rem;
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .new-chat-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .new-chat-btn:hover { background: var(--accent-hover); }

    .history-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      padding: 0 6px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover, .history-item.active {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Main Chat Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 100%;
    }

    header {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 12px;
    }

    select {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      max-width: 460px;
      color: var(--text-secondary);
    }

    .empty-state h1 {
      color: var(--text-primary);
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 0.95rem;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .msg.user {
      background: var(--accent);
      color: #fff;
      align-self: flex-end;
    }

    .msg.assistant {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      align-self: flex-start;
    }

    .msg-meta {
      font-size: 0.72rem;
      opacity: 0.75;
      margin-bottom: 4px;
    }

    /* Composer */
    .composer-wrap {
      padding: 12px 20px 20px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    form {
      display: flex;
      gap: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      max-height: 140px;
      outline: none;
      padding: 4px;
    }

    button.send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button.send-btn:hover { background: var(--accent-hover); }

    @media (max-width: 720px) {
      aside { display: none; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <span>Private Chat</span>
      <span class="privacy-pill">Local Demo</span>
    </div>
    <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
    <div class="history-label">Recent Chats</div>
    <div class="history-list" id="historyList"></div>
    <div class="sidebar-footer">
      Demo interface only. Chats stay in browser memory and no live AI API is connected.
    </div>
  </aside>

  <main>
    <header>
      <span style="font-size: 0.88rem; color: var(--text-secondary);">Model:</span>
      <select id="modelSelect" aria-label="Choose AI model">
        <option value="Fast General Model">Fast General Model</option>
        <option value="Reasoning Model">Reasoning Model</option>
        <option value="Open-Weights Model">Open-Weights Model</option>
        <option value="Compact Assistant">Compact Assistant</option>
      </select>
    </header>

    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <h1>Start a private session</h1>
        <p>This is a standalone HTML/CSS/JS layout inspired by minimal AI chat interfaces. Type a message below to test the UI.</p>
      </div>
    </div>

    <div class="composer-wrap">
      <form id="chatForm">
        <textarea id="promptInput" rows="1" placeholder="Ask anything..." required></textarea>
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>
  </main>

  <script>
    const state = {
      chats: [{ id: 1, title: "Sample Chat", messages: [] }],
      activeId: 1
    };

    const messagesEl = document.getElementById("messages");
    const emptyStateEl = document.getElementById("emptyState");
    const historyListEl = document.getElementById("historyList");
    const formEl = document.getElementById("chatForm");
    const inputEl = document.getElementById("promptInput");
    const modelEl = document.getElementById("modelSelect");
    const newChatBtn = document.getElementById("newChatBtn");

    function getActiveChat() {
      return state.chats.find(c => c.id === state.activeId);
    }

    function renderHistory() {
      historyListEl.innerHTML = "";
      state.chats.forEach(chat => {
        const div = document.createElement("div");
        div.className = "history-item" + (chat.id === state.activeId ? " active" : "");
        div.textContent = chat.title;
        div.onclick = () => {
          state.activeId = chat.id;
          renderHistory();
          renderMessages();
        };
        historyListEl.appendChild(div);
      });
    }

    function renderMessages() {
      const chat = getActiveChat();
      messagesEl.innerHTML = "";
      if (!chat.messages.length) {
        messagesEl.appendChild(emptyStateEl);
        return;
      }
      chat.messages.forEach(m => {
        const box = document.createElement("div");
        box.className = "msg " + m.role;
        const meta = document.createElement("div");
        meta.className = "msg-meta";
        meta.textContent = m.role === "user" ? "You" : m.model;
        const body = document.createElement("div");
        body.textContent = m.text;
        box.appendChild(meta);
        box.appendChild(body);
        messagesEl.appendChild(box);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      const chat = getActiveChat();
      if (!chat.messages.length) {
        chat.title = text.slice(0, 32);
      }

      chat.messages.push({ role: "user", text });
      const selectedModel = modelEl.value;
      chat.messages.push({
        role: "assistant",
        model: selectedModel,
        text: `Simulated response from "${selectedModel}". Connect a backend endpoint or API to generate real replies.`
      });

      inputEl.value = "";
      renderHistory();
      renderMessages();
    });

    newChatBtn.addEventListener("click", () => {
      const id = Date.now();
      state.chats.unshift({ id, title: "New Chat", messages: [] });
      state.activeId = id;
      renderHistory();
      renderMessages();
    });

    renderHistory();
    renderMessages();
  </script>
</body>
</html>
